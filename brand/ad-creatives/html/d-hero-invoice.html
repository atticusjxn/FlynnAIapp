<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { height: 100vh; }
  body.dark { display: flex; flex-direction: column; }
  .frame { flex: 1; display: flex; flex-direction: column; padding: 68px 84px 0; position: relative; z-index: 2; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { margin: 34px 0 18px; }
  .headline { font-size: 104px; line-height: 1.0; letter-spacing: -2.5px; color: var(--cream); }
  .headline .o { color: var(--orange); }
  .top-spacer { flex: 0.2; }
  .stage { flex: 1; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .phone { width: 88%; max-width: 760px; transform: rotate(3deg); }
  .phone { box-shadow: 10px 10px 0 0 rgba(244,230,206,.4); }
</style></head>
<body class="dark">
  <div class="motif" style="width:460px;height:460px;top:-180px;left:-180px;border-color:rgba(244,230,206,.3);"></div>

  <div class="frame">
    <div class="top">
      <div class="wordmark"><span class="txt display" style="color:var(--cream)">Flynn</span><span class="dot"></span></div>
    </div>
    <span class="eyebrow">Get paid faster</span>
    <h1 class="headline display">Send it. Get<br>paid <span class="o">on the spot.</span></h1>
    <div class="top-spacer"></div>

    <div class="stage">
      <div class="phone"><img src="../assets/invoice.webp" alt=""></div>
    </div>
  </div>
</body></html>
