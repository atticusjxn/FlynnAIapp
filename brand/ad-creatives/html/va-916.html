<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { width: auto; background: transparent; }
  body { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
  .asset { position: relative; overflow: hidden; flex-shrink: 0; }

  /* ---- background stage 1080x1920 ---- */
  #bg { width: 1080px; height: 1920px; background: var(--cream); }
  #bg .wordmark { position: absolute; top: 84px; left: 84px; }

  /* ---- phone chassis on transparent 720x1380 canvas ---- */
  #chassis { width: 720px; height: 1380px; background: transparent; overflow: visible; }
  #chassis .frame {
    position: absolute; left: 64px; top: 40px;
    width: 560px; height: 1218px;               /* inner screen box */
    border: 16px solid var(--ink); border-radius: 64px; box-sizing: content-box;
    box-shadow: 12px 12px 0 0 var(--ink);
    background: transparent;
  }

  /* ---- captions, transparent 1080x170 ---- */
  .cap { width: 1080px; height: 170px; background: transparent;
    display: flex; align-items: center; justify-content: center; }
  .cap span { font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 66px; letter-spacing: -1px; color: var(--ink); }
  .cap .o { color: var(--orange); }

  /* ---- end card 1080x1920 ---- */
  #end { width: 1080px; height: 1920px; background: var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #end .headline { font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 120px; line-height: 1.02; letter-spacing: -3px; color: var(--ink); text-align: center; }
  #end .headline .o { color: var(--orange); }
  #end .mascot { width: 300px; margin-top: 70px; }
  #end .pill-cta { margin-top: 80px; }
  #end .wordmark { position: absolute; top: 84px; left: 84px; }
</style></head>
<body>

  <div class="asset" id="bg">
    <div class="motif" style="width:460px;height:460px;top:-180px;right:-180px;border-color:var(--mustard);"></div>
    <div class="motif" style="width:300px;height:300px;bottom:-120px;left:-120px;border-color:var(--teal);opacity:.55;"></div>
    <div class="wordmark"><span class="txt display">Flynn</span><span class="dot"></span></div>
  </div>

  <div class="asset" id="chassis">
    <div class="frame"></div>
  </div>

  <div class="asset cap" id="cap1"><span>flynn already <span class="o">answered</span> it</span></div>
  <div class="asset cap" id="cap2"><span>took the <span class="o">whole job</span> down</span></div>
  <div class="asset cap" id="cap3"><span>and <span class="o">booked it</span> in</span></div>

  <div class="asset" id="end">
    <div class="motif" style="width:520px;height:520px;top:-220px;right:-220px;border-color:var(--mustard);"></div>
    <div class="motif" style="width:300px;height:300px;bottom:-120px;left:-120px;border-color:var(--terracotta);opacity:.5;"></div>
    <div class="wordmark"><span class="txt display">Flynn</span><span class="dot"></span></div>
    <div class="headline">Never miss<br>another <span class="o">job.</span></div>
    <img class="mascot" src="../assets/mascot-thumbsup.png" alt="">
    <div class="pill-cta"><div class="cta-bar">7-day free trial</div></div>
  </div>

</body></html>
