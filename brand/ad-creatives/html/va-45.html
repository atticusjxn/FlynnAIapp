<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { width: auto; background: transparent; }
  body { display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
  .asset { position: relative; overflow: hidden; flex-shrink: 0; }

  /* ---- background stage 1080x1350 ---- */
  #bg { width: 1080px; height: 1350px; background: var(--cream); }
  #bg .wordmark { position: absolute; top: 64px; left: 72px; }

  /* ---- phone chassis on transparent 560x1050 canvas ---- */
  #chassis { width: 560px; height: 1050px; background: transparent; overflow: visible; }
  #chassis .frame {
    position: absolute; left: 56px; top: 30px;
    width: 420px; height: 913px;
    border: 14px solid var(--ink); border-radius: 56px; box-sizing: content-box;
    box-shadow: 10px 10px 0 0 var(--ink);
    background: transparent;
  }

  /* ---- captions, transparent 1080x140 ---- */
  .cap { width: 1080px; height: 140px; background: transparent;
    display: flex; align-items: center; justify-content: center; }
  .cap span { font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 60px; letter-spacing: -1px; color: var(--ink); }
  .cap .o { color: var(--orange); }

  /* ---- end card 1080x1350 ---- */
  #end { width: 1080px; height: 1350px; background: var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #end .headline { font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: 104px; line-height: 1.02; letter-spacing: -2.5px; color: var(--ink); text-align: center; }
  #end .headline .o { color: var(--orange); }
  #end .mascot { width: 240px; margin-top: 48px; }
  #end .pill-cta { margin-top: 56px; }
  #end .wordmark { position: absolute; top: 64px; left: 72px; }
</style></head>
<body>

  <div class="asset" id="bg">
    <div class="motif" style="width:400px;height:400px;top:-160px;right:-160px;border-color:var(--mustard);"></div>
    <div class="motif" style="width:260px;height:260px;bottom:-100px;left:-100px;border-color:var(--teal);opacity:.55;"></div>
    <div class="wordmark"><span class="txt display">Flynn</span><span class="dot"></span></div>
  </div>

  <div class="asset" id="chassis">
    <div class="frame"></div>
  </div>

  <div class="asset cap" id="cap1"><span>flynn already <span class="o">answered</span> it</span></div>
  <div class="asset cap" id="cap2"><span>took the <span class="o">whole job</span> down</span></div>
  <div class="asset cap" id="cap3"><span>and <span class="o">booked it</span> in</span></div>

  <div class="asset" id="end">
    <div class="motif" style="width:440px;height:440px;top:-180px;right:-180px;border-color:var(--mustard);"></div>
    <div class="motif" style="width:260px;height:260px;bottom:-100px;left:-100px;border-color:var(--terracotta);opacity:.5;"></div>
    <div class="wordmark"><span class="txt display">Flynn</span><span class="dot"></span></div>
    <div class="headline">Never miss<br>another <span class="o">job.</span></div>
    <img class="mascot" src="../assets/mascot-thumbsup.png" alt="">
    <div class="pill-cta"><div class="cta-bar">7-day free trial</div></div>
  </div>

</body></html>
