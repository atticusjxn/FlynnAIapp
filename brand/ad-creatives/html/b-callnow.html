<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { height: 100vh; }
  body { display: flex; flex-direction: column; }
  .frame { flex: 1; display: flex; flex-direction: column; padding: 72px 84px; position: relative; z-index: 2; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top-spacer { flex: 0.3; }
  .headline { font-size: 132px; line-height: 1.0; letter-spacing: -3px; }
  .headline .o { color: var(--orange); }
  .mid-spacer { flex: 0.25; }
  .mascot-row { display: flex; justify-content: center; }
  .mascot { width: 74%; max-width: 640px; height: auto; }
  .bottom-spacer { flex: 0.3; }
  .bottom { display: flex; justify-content: flex-start; }
  /* Square (1:1): scale so headline + mascot + CTA all fit. */
  @media (min-aspect-ratio: 9/10) {
    .frame { padding: 56px 84px 64px; }
    .top-spacer { flex: 0.12; }
    .mid-spacer, .bottom-spacer { flex: 0.1; }
    .headline { font-size: 96px; }
    .mascot { width: 46%; max-width: 420px; }
  }
</style></head>
<body>
  <div class="motif" style="width:420px;height:420px;top:-160px;left:-160px;border-color:var(--teal);opacity:.55;"></div>
  <div class="motif" style="width:300px;height:300px;bottom:-120px;right:-120px;border-color:var(--mustard);"></div>

  <div class="frame">
    <div class="top">
      <div class="wordmark"><span class="txt display">Flynn</span><span class="dot"></span></div>
      <span class="eyebrow">Your receptionist</span>
    </div>
    <div class="top-spacer"></div>

    <h1 class="headline display">Hear Flynn<br><span class="o">answer.</span></h1>

    <div class="mid-spacer"></div>
    <div class="mascot-row"><img class="mascot" src="../assets/mascot-wave.png" alt=""></div>
    <div class="bottom-spacer"></div>

    <div class="bottom">
      <div class="cta-bar">📞&nbsp; Try Flynn free</div>
    </div>
  </div>
</body></html>
