<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { height: 100vh; }
  body.dark {
    display: flex; flex-direction: column;
  }
  .frame { flex: 1; display: flex; flex-direction: column; padding: 72px 84px; position: relative; z-index: 2; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top-spacer { flex: 0.4; }
  .eyebrow { margin-bottom: 26px; }
  .headline { font-size: 100px; line-height: 1.02; letter-spacing: -2px; }
  .stat-wrap { display: flex; align-items: baseline; gap: 26px; margin: 52px 0 0; }
  .stat { font-size: 300px; line-height: 1; letter-spacing: -8px; color: var(--orange); }
  .stat-unit { font-size: 56px; color: var(--cream); opacity: .85; }
  .mid-spacer { flex: 0.4; }
  .bottom { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .mascot { width: 280px; height: auto; flex-shrink: 0; }
  /* Square (1:1): tighten spacers + scale so the CTA row stays fully inside. */
  @media (min-aspect-ratio: 9/10) {
    .frame { padding: 56px 84px 64px; }
    .top-spacer, .mid-spacer { flex: 0.14; }
    .headline { font-size: 78px; }
    .stat { font-size: 210px; letter-spacing: -5px; }
    .stat-unit { font-size: 46px; }
    .stat-wrap { margin: 30px 0 0; }
    .mascot { width: 235px; }
  }
</style></head>
<body class="dark">
  <div class="motif" style="width:520px;height:520px;top:-220px;right:-220px;"></div>
  <div class="motif" style="width:260px;height:260px;bottom:-90px;left:-90px;border-color:var(--terracotta);opacity:.5;"></div>

  <div class="frame">
    <div class="top">
      <div class="wordmark"><span class="txt display" style="color:var(--cream)">Flynn</span><span class="dot"></span></div>
    </div>
    <div class="top-spacer"></div>

    <div class="eyebrow">Every missed call</div>
    <h1 class="headline display">A job goes to<br>someone who<br><span style="color:var(--orange)">answered.</span></h1>

    <div class="stat-wrap">
      <span class="stat display">$400</span>
      <span class="stat-unit display-semi">avg. job value*</span>
    </div>

    <div class="mid-spacer"></div>

    <div class="bottom">
      <div class="cta-bar">Never miss another job</div>
      <img class="mascot" src="../assets/mascot-thumbsup.png" alt="">
    </div>
  </div>
</body></html>
