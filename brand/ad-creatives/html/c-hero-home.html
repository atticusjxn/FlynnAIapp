<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { height: 100vh; }
  body { display: flex; flex-direction: column; }
  .frame { flex: 1; display: flex; flex-direction: column; padding: 68px 84px 0; position: relative; z-index: 2; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { margin: 34px 0 16px; }
  .headline { font-size: 78px; line-height: 1.03; letter-spacing: -1.5px; }
  .headline .o { color: var(--orange); }
  .top-spacer { flex: 0.35; }
  .stage { flex: 1; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .phone { width: 74%; max-width: 620px; transform: rotate(-3deg); }
</style></head>
<body>
  <div class="motif" style="width:460px;height:460px;top:-180px;right:-180px;border-color:var(--mustard);"></div>

  <div class="frame">
    <div class="top">
      <div class="wordmark"><span class="txt display">Flynn</span><span class="dot"></span></div>
    </div>
    <span class="eyebrow">Your AI receptionist</span>
    <h1 class="headline display">Never miss<br>another <span class="o">job.</span></h1>
    <div class="top-spacer"></div>

    <div class="stage">
      <div class="phone"><img src="../assets/home.webp" alt=""></div>
    </div>
  </div>
</body></html>
